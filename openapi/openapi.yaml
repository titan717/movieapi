openapi: 3.1.0
info:
  title: MovieApi
  version: 0.7.0
  description: Kinoma media API with metadata, reliability, discovery, videos, and provider-independent playback.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: API health
      responses:
        "200":
          description: Healthy API
  /version:
    get:
      summary: API version
      responses:
        "200":
          description: Version information
  /search:
    get:
      summary: Search TV shows
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Normalized TV search results
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /tv/search:
    get:
      summary: Search TV shows through the TV route
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Normalized TV search results
  /tv/{id}:
    get:
      summary: Get a normalized TV show
      parameters:
        - $ref: "#/components/parameters/ShowId"
      responses:
        "200":
          description: TV show
        "404":
          $ref: "#/components/responses/NotFound"
  /tv/{id}/seasons:
    get:
      summary: List seasons for a TV show
      parameters:
        - $ref: "#/components/parameters/ShowId"
      responses:
        "200":
          description: Seasons
  /tv/{id}/episodes:
    get:
      summary: List episodes for a TV show
      parameters:
        - $ref: "#/components/parameters/ShowId"
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: specials
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Paginated episodes
  /tv/{id}/season/{season}:
    get:
      summary: Get a season and its episodes
      parameters:
        - $ref: "#/components/parameters/ShowId"
        - $ref: "#/components/parameters/Season"
      responses:
        "200":
          description: Season and episodes
  /tv/{id}/season/{season}/episode/{episode}:
    get:
      summary: Get one episode by season and number
      parameters:
        - $ref: "#/components/parameters/ShowId"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      responses:
        "200":
          description: Episode
        "404":
          $ref: "#/components/responses/NotFound"
  /tv/{id}/images:
    get:
      summary: Get TVmaze show images
      parameters:
        - $ref: "#/components/parameters/ShowId"
      responses:
        "200":
          description: Show images
  /tmdb/movie/{id}:
    get:
      summary: Get a normalized TMDB movie
      parameters:
        - $ref: "#/components/parameters/TmdbId"
      responses:
        "200":
          description: TMDB movie
  /tmdb/tv/{id}:
    get:
      summary: Get a normalized TMDB TV show
      parameters:
        - $ref: "#/components/parameters/TmdbId"
      responses:
        "200":
          description: TMDB TV show
  /tmdb/search/tv:
    get:
      summary: Search TMDB TV shows
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: TMDB TV search results
  /tmdb/search/movie:
    get:
      summary: Search TMDB movies
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: TMDB movie search results
  /airing:
    get:
      summary: Get a country/date airing schedule
      parameters:
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/Date"
      responses:
        "200":
          description: Airing episodes
  /airing/today:
    get:
      summary: Get today's airing schedule
      parameters:
        - $ref: "#/components/parameters/Country"
      responses:
        "200":
          description: Airing episodes
  /airing/date/{date}:
    get:
      summary: Get an airing schedule for a date
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - $ref: "#/components/parameters/Country"
      responses:
        "200":
          description: Airing episodes
  /popular/movies:
    get:
      summary: Popular movies
      responses:
        "200": { description: Popular movies }
  /popular/tv:
    get:
      summary: Popular TV
      responses:
        "200": { description: Popular TV }
  /latest/movies:
    get:
      summary: Latest movies
      responses:
        "200": { description: Latest movies }
  /latest/tv:
    get:
      summary: Latest TV
      responses:
        "200": { description: Latest TV }
  /upcoming/movies:
    get:
      summary: Upcoming movies
      responses:
        "200": { description: Upcoming movies }
  /upcoming/tv:
    get:
      summary: Upcoming TV
      responses:
        "200": { description: Upcoming TV }
  /airing/upcoming:
    get:
      summary: Upcoming TV airing
      responses:
        "200": { description: Upcoming TV }
  /trending:
    get:
      summary: Trending movies and TV
      responses:
        "200": { description: Trending results }
  /featured:
    get:
      summary: Featured media
      responses:
        "200": { description: Featured media }
  /genres:
    get:
      summary: List genres
      responses:
        "200": { description: Genre list }
  /genres/{genre}:
    get:
      summary: Discover by genre
      responses:
        "200": { description: Genre results }
        "404":
          $ref: "#/components/responses/NotFound"
  /recommendations/{id}:
    get:
      summary: Recommendations
      responses:
        "200": { description: Recommendations }
  /home:
    get:
      summary: Kinoma homepage discovery aggregation
      responses:
        "200": { description: Home discovery data }
  /movie/{id}/sources:
    get:
      summary: Get movie playback sources
      parameters:
        - $ref: "#/components/parameters/TmdbId"
      responses:
        "200": { description: Provider-neutral movie playback sources }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /movie/{id}/play:
    get:
      summary: Get primary movie playback source
      parameters:
        - $ref: "#/components/parameters/TmdbId"
      responses:
        "200": { description: Primary movie playback source }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /tv/{id}/season/{season}/episode/{episode}/sources:
    get:
      summary: Get TV episode playback sources
      parameters:
        - $ref: "#/components/parameters/TmdbId"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      responses:
        "200": { description: Provider-neutral TV episode playback sources }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
  /tv/{id}/season/{season}/episode/{episode}/play:
    get:
      summary: Get primary TV episode playback source
      parameters:
        - $ref: "#/components/parameters/TmdbId"
        - $ref: "#/components/parameters/Season"
        - $ref: "#/components/parameters/Episode"
      responses:
        "200": { description: Primary TV episode playback source }
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "503":
          $ref: "#/components/responses/ProviderUnavailable"
components:
  parameters:
    TmdbId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    ShowId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Season:
      name: season
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Episode:
      name: episode
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Country:
      name: country
      in: query
      schema: { type: string, pattern: "^[A-Za-z]{2}$", default: US }
    Date:
      name: date
      in: query
      schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ProviderUnavailable:
      description: Playback provider unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: {}
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }

# Phase 7 playback source schema
# Playback sources are client-side embed URLs returned by the configured provider.
